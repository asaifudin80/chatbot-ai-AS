<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .chat-box {
      width: 100%;
      max-width: 500px;
      background: #2a2a3e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    .header {
      background: #6c5ce7;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
    }
    #messages {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #6c5ce7;
      color: white;
      border-bottom-right-radius: 2px;
    }
    .bot {
      align-self: flex-start;
      background: #3d3d5c;
      color: #eee;
      border-bottom-left-radius: 2px;
    }
    .input-area {
      display: flex;
      padding: 10px;
      gap: 8px;
      background: #232336;
    }
    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3d3d5c;
      color: white;
      outline: none;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #5a4bd1; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="header">🤖 Chatbot AI</div>
    <div id="messages">
      <div class="msg bot">Halo! Ada yang bisa saya bantu?</div>
    </div>
    <div class="input-area">
      <input id="input" placeholder="Tulis pesan..." autofocus>
      <button onclick="kirim()">Kirim</button>
    </div>
  </div>

  <script>
    const API_KEY ="AIzaSyAQ.Ab8RN6JGzO6w0DCTq0JBjn6veUjfvBv5KSEFs4liPXxbnWbvOQ";

    async function kirim() {
      const input = document.getElementById("input");
      const pesan = input.value.trim();
      if (!pesan) return;

      tampilkan(pesan, "user");
      input.value = "";

      const loading = tampilkan("Mengetik...", "bot");

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: pesan }] }]
            })
          }
        );
        const data = await res.json();
        loading.textContent = data.candidates[0].content.parts[0].text;
      } catch (err) {
        loading.textContent = "❌ Terjadi kesalahan. Cek API key-mu.";
      }
    }

    function tampilkan(teks, siapa) {
      const div = document.createElement("div");
      div.className = "msg " + siapa;
      div.textContent = teks;
      document.getElementById("messages").appendChild(div);
      document.getElementById("messages").scrollTop = 999999;
      return div;
    }

    // Kirim dengan tombol Enter
    document.getElementById("input").addEventListener("keydown", e => {
      if (e.key === "Enter") kirim();
    });
  </script>
</body>
</html>
